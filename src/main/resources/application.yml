server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: llm-api-gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  codec:
    max-in-memory-size: 2MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  reactor:
    context-propagation: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: llm-api-gateway

info:
  app:
    name: llm-api-gateway
    description: OpenAI-compatible gateway for LLM providers
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gateway:
  auth:
    keys:
      - id: ${GATEWAY_KEY_ID:local}
        secret: ${GATEWAY_API_KEY:local-dev-key-change-me}
        requests-per-minute: ${GATEWAY_RPM:60}
    keys-env: ${GATEWAY_API_KEYS:}
  provider:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    connect-timeout: 5s
    response-timeout: ${OPENAI_TIMEOUT:60s}
    max-retries: 2
    retry-initial-backoff: 200ms
  pricing:
    default-input-per-million: "1.00"
    default-output-per-million: "3.00"
    # Sample rates for local estimates. Replace these before using the numbers
    # for chargeback. Bracketed keys keep dots from becoming nested properties.
    models:
      "[gpt-4o]":
        input-per-million: "2.50"
        output-per-million: "10.00"
      "[gpt-4o-mini]":
        input-per-million: "0.15"
        output-per-million: "0.60"
      "[gpt-4.1]":
        input-per-million: "2.00"
        output-per-million: "8.00"
      "[gpt-4.1-mini]":
        input-per-million: "0.40"
        output-per-million: "1.60"
      "[gpt-4.1-nano]":
        input-per-million: "0.10"
        output-per-million: "0.40"
